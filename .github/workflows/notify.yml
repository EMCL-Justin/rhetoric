name: Phrase Notification

on:
  schedule:
    - cron: '0 15-23 * * *'  # 10am–6pm CT (hourly)
    - cron: '0 0,1   * * *'  #  7pm–8pm CT (hourly)
  workflow_dispatch:        # manual trigger for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node notify.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
