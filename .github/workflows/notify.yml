name: Phrase Notification

on:
  schedule:
    - cron: '0 15-23 * * *'  # 10am–6pm CT (hourly)
    - cron: '0 0,1   * * *'  #  7pm–8pm CT (hourly)
  workflow_dispatch:        # manual trigger for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # needed for the keepalive step below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node notify.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow via the API counts as activity and resets that
      # timer, so this step keeps the schedule alive forever with no dummy commits.
      - name: Keepalive
        run: gh workflow enable notify.yml
        env:
          GH_TOKEN: ${{ github.token }}
